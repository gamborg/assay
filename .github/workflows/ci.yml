name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Node 20 and 22 disagree about the test runner's CLI, which is exactly the
      # kind of thing this matrix exists to catch -- so don't let one version
      # cancel the other before it has reported.
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm test

      # The harness evaluating itself. The scripted target is deterministic, so
      # this asserts that the pipeline still produces the outcomes it produced
      # yesterday -- loop, tools, gates, reports and the exit code all included.
      - name: Self-check against the offline demo
        run: |
          node bin/assay.js run \
            --config examples/demo.config.yaml \
            --target scripted-good \
            --save false
