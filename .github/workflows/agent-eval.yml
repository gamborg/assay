# Evaluation as a CI gate.
#
# This is the shape the harness is actually for: a scheduled regression suite
# that tells you a model or prompt change made your agent worse, before your
# users do.
#
# The paid, against-a-real-model half only runs when ANTHROPIC_API_KEY is set in
# the repository secrets, because a fork or a fresh clone has no key and should
# not fail for it. The offline half always runs, so the schedule proves the
# harness itself still works even before anyone wires up a key.
#
# To enable the real thing: add ANTHROPIC_API_KEY to the repository secrets and
# commit a baseline (`assay baseline --target frontier`).

name: Agent evaluation

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci

      # Cheap, offline, and always run: a broken scenario file or a broken
      # harness should be reported as such, not as a model regression.
      - name: Check the suite loads and the harness runs
        run: |
          node bin/assay.js list
          node bin/assay.js run \
            --config examples/demo.config.yaml \
            --target scripted-good \
            --save false

      - name: Look for credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo 'ANTHROPIC_API_KEY is not set -- skipping the against-a-real-model gate.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Exits 1 on a regression against the committed baseline, 2 if the harness
      # itself could not run. Those need different people to look at them.
      - name: Gate against the baseline
        if: steps.creds.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node bin/assay.js run --gate --target frontier

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: assay-runs
          path: .assay/runs/
          if-no-files-found: ignore
